name: Auto Build Skill.Sea Catalog

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'library/**'
      - 'category/**'
      - '.agent/skills/**'
      - 'Skill.Sea/scripts/build-catalog.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild Skill.Sea Catalog & Categories
        run: |
          node Skill.Sea/scripts/build-catalog.js

      - name: Auto-commit and push updated catalog data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(catalog): auto-rebuild Skill.Sea catalog for updated skills [skip ci]"
          branch: main
          file_pattern: "Skill.Sea/data/*.json"
