name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'Skill.Sea/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Skill.Sea/**'
  workflow_dispatch:

jobs:
  static-verification:
    name: Static verification (64+ checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Run verify.js
        run: node Skill.Sea/scripts/verify.js

  e2e:
    name: Playwright E2E (desktop + mobile)
    runs-on: ubuntu-latest
    needs: static-verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
      - name: Start local server
        run: |
          cd Skill.Sea
          nohup node server.js > /tmp/skill-sea-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8080/; then
              echo "Server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          cat /tmp/skill-sea-server.log
          exit 1
      - name: Run E2E suite
        run: python Skill.Sea/tests/test_webapp.py
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            Skill.Sea/test-results/
            Skill.Sea/playwright-report/
          if-no-files-found: ignore
      - name: Stop server
        if: always()
        run: pkill -f "node server.js" || true
