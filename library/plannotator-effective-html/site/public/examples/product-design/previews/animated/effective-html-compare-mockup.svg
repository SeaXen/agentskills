<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Animated Effective HTML comparison mockup</title>
  <desc id="desc">A lilac focus frame moves between the two warm-paper HTML specimens.</desc>
  <style>
    .ring{fill:none;stroke:#a884e8;stroke-width:4;opacity:0;transform-box:fill-box;transform-origin:center}
    .left{animation:left 6.4s cubic-bezier(.19,1,.22,1) infinite}
    .right{animation:right 6.4s cubic-bezier(.19,1,.22,1) infinite}
    .pulse{fill:#1bae61;opacity:0;transform-box:fill-box;transform-origin:center;animation:pulse 6.4s cubic-bezier(.19,1,.22,1) infinite}
    @keyframes left{0%,8%{opacity:0;transform:scale(.985)}16%,38%{opacity:1;transform:scale(1)}46%,100%{opacity:0}}
    @keyframes right{0%,46%{opacity:0;transform:scale(.985)}54%,76%{opacity:1;transform:scale(1)}84%,100%{opacity:0}}
    @keyframes pulse{0%,82%{opacity:0;transform:scale(.9)}88%{opacity:1;transform:scale(1)}96%,100%{opacity:0;transform:scale(1.1)}}
    @media(prefers-reduced-motion:reduce){.ring,.pulse{animation:none;opacity:0}}
  </style>
  <image href="data:image/svg+xml;base64," width="640" height="400"/>
  <rect class="ring left" x="20" y="78" width="292" height="300" rx="8"/>
  <rect class="ring right" x="328" y="78" width="292" height="300" rx="8"/>
  <circle class="pulse" cx="47" cy="42" r="16"/>
</svg>
