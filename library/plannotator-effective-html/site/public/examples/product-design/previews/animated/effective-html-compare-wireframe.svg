<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Animated Effective HTML comparison wireframe</title>
  <desc id="desc">Focus moves once between two compared grayscale browser wireframes.</desc>
  <style>
    .focus-a,.focus-b{fill:none;stroke:#2457d6;stroke-width:4;opacity:0;transform-box:fill-box;transform-origin:center}
    .focus-a{animation:focus-a 6s cubic-bezier(.19,1,.22,1) infinite}
    .focus-b{animation:focus-b 6s cubic-bezier(.19,1,.22,1) infinite}
    @keyframes focus-a{0%,8%{opacity:0;transform:scale(.98)}16%,38%{opacity:1;transform:scale(1)}46%,100%{opacity:0;transform:scale(1)}}
    @keyframes focus-b{0%,46%{opacity:0;transform:scale(.98)}54%,76%{opacity:1;transform:scale(1)}84%,100%{opacity:0;transform:scale(1)}}
    @media(prefers-reduced-motion:reduce){.focus-a,.focus-b{animation:none;opacity:0}}
  </style>
  <image href="data:image/svg+xml;base64," width="640" height="400"/>
  <rect class="focus-a" x="44" y="94" width="258" height="246" rx="2"/>
  <rect class="focus-b" x="338" y="94" width="258" height="246" rx="2"/>
</svg>
