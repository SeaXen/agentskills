<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Animated Plannotator review mockup</title>
  <desc id="desc">The annotation pin and matching comment receive one restrained review pulse.</desc>
  <style>
    .pin{fill:#e5ad55;stroke:#080d18;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pin 5.8s cubic-bezier(.19,1,.22,1) infinite}
    .comment-focus{fill:none;stroke:#a68af8;stroke-width:3;opacity:0;animation:comment 5.8s cubic-bezier(.19,1,.22,1) infinite}
    .connector{fill:none;stroke:#e5ad55;stroke-width:2;stroke-dasharray:100 110;stroke-dashoffset:100;animation:draw 5.8s cubic-bezier(.19,1,.22,1) infinite}
    @keyframes pin{0%,12%{transform:scale(1)}20%{transform:scale(1.22)}28%,100%{transform:scale(1)}}
    @keyframes draw{0%,20%{stroke-dashoffset:100;opacity:0}30%{opacity:1}44%,62%{stroke-dashoffset:0;opacity:1}72%,100%{opacity:0}}
    @keyframes comment{0%,42%{opacity:0}50%,70%{opacity:1}80%,100%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.pin,.comment-focus,.connector{animation:none}.connector,.comment-focus{opacity:0}}
  </style>
  <image href="data:image/svg+xml;base64," width="640" height="400"/>
  <circle class="pin" cx="262" cy="187" r="13"/>
  <path class="connector" pathLength="100" d="M275 187C350 187 402 118 482 112"/>
  <rect class="comment-focus" x="478" y="74" width="132" height="80" rx="4"/>
</svg>
