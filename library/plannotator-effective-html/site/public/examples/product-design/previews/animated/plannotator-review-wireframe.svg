<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Animated Plannotator review wireframe</title>
  <desc id="desc">Review focus moves from the document canvas to the comment sidebar.</desc>
  <style>
    .canvas-focus,.comments-focus{fill:none;stroke:#2457d6;stroke-width:4;opacity:0;transform-box:fill-box;transform-origin:center}
    .canvas-focus{animation:canvas 6s cubic-bezier(.19,1,.22,1) infinite}
    .comments-focus{animation:comments 6s cubic-bezier(.19,1,.22,1) infinite}
    @keyframes canvas{0%,10%{opacity:0;transform:scale(.985)}18%,40%{opacity:1;transform:scale(1)}48%,100%{opacity:0}}
    @keyframes comments{0%,48%{opacity:0;transform:scale(.985)}56%,80%{opacity:1;transform:scale(1)}88%,100%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.canvas-focus,.comments-focus{animation:none;opacity:0}}
  </style>
  <image href="data:image/svg+xml;base64," width="640" height="400"/>
  <rect class="canvas-focus" x="78" y="76" width="368" height="286" rx="3"/>
  <rect class="comments-focus" x="462" y="76" width="144" height="286" rx="3"/>
</svg>
