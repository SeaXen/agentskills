<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Animated product change review mockup</title>
  <desc id="desc">An orange review mark moves from the proposed member action to the corresponding note.</desc>
  <style>
    .mark{fill:#f0643c;stroke:#11131a;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:mark 6.2s cubic-bezier(.19,1,.22,1) infinite}
    .path{fill:none;stroke:#f0643c;stroke-width:3;stroke-dasharray:100 110;stroke-dashoffset:100;opacity:0;animation:path 6.2s cubic-bezier(.19,1,.22,1) infinite}
    .note{fill:none;stroke:#f0643c;stroke-width:3;opacity:0;animation:note 6.2s cubic-bezier(.19,1,.22,1) infinite}
    @keyframes mark{0%,10%{opacity:0;transform:scale(.8)}18%,48%{opacity:1;transform:scale(1)}58%,100%{opacity:0;transform:scale(1.1)}}
    @keyframes path{0%,28%{opacity:0;stroke-dashoffset:100}36%{opacity:1}52%,64%{opacity:1;stroke-dashoffset:0}74%,100%{opacity:0}}
    @keyframes note{0%,54%{opacity:0}62%,82%{opacity:1}92%,100%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.mark,.path,.note{animation:none;opacity:0}}
  </style>
  <image href="data:image/svg+xml;base64," width="640" height="400"/>
  <circle class="mark" cx="460" cy="259" r="11"/>
  <path class="path" pathLength="100" d="M470 257C512 246 520 198 548 178"/>
  <rect class="note" x="512" y="146" width="90" height="64" rx="4"/>
</svg>
