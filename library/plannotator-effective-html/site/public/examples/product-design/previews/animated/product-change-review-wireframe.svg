<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Animated product change review wireframe</title>
  <desc id="desc">Focus moves from the current screen to the proposed screen and then to the decision notes.</desc>
  <style>
    .focus{fill:none;stroke:#2457d6;stroke-width:4;opacity:0;transform-box:fill-box;transform-origin:center}
    .current{animation:current 7s cubic-bezier(.19,1,.22,1) infinite}.proposed{animation:proposed 7s cubic-bezier(.19,1,.22,1) infinite}.notes{animation:notes 7s cubic-bezier(.19,1,.22,1) infinite}
    @keyframes current{0%,7%{opacity:0;transform:scale(.985)}14%,29%{opacity:1;transform:scale(1)}36%,100%{opacity:0}}
    @keyframes proposed{0%,36%{opacity:0;transform:scale(.985)}43%,58%{opacity:1;transform:scale(1)}65%,100%{opacity:0}}
    @keyframes notes{0%,65%{opacity:0;transform:scale(.985)}72%,87%{opacity:1;transform:scale(1)}94%,100%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.focus{animation:none;opacity:0}}
  </style>
  <image href="data:image/svg+xml;base64," width="640" height="400"/>
  <rect class="focus current" x="40" y="100" width="258" height="244" rx="3"/>
  <rect class="focus proposed" x="334" y="100" width="150" height="244" rx="3"/>
  <rect class="focus notes" x="512" y="96" width="90" height="196" rx="3"/>
</svg>
