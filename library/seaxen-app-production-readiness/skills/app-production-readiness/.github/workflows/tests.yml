name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  self-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Run the test suite
        run: python -m pytest scripts/ -q

      - name: Run the preflight self-test
        run: python scripts/test_preflight.py

      - name: Package health check
        run: python scripts/skill_check.py --root .

      - name: Absorbed-code integrity
        run: python scripts/absorbed/verify_manifest.py
