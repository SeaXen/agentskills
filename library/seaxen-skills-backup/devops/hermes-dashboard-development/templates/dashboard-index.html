<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Plugin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacFont, 'Segoe UI', sans-serif; background: #0f1117; color: #c9d1d9; min-height: 100vh; }
  .header { background: #161b22; border-bottom: 1px solid #30363d; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 18px; font-weight: 600; color: #e6edf3; }
  .header .actions { display: flex; gap: 8px; align-items: center; }
  .header select { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .header .refresh-btn { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }

  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; text-align: center; }
  .stat-card .value { font-size: 22px; font-weight: 700; color: #e6edf3; }
  .stat-card .label { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
  .stat-card.green .value { color: #3fb950; }
  .stat-card.red .value { color: #f85149; }
  .stat-card.blue .value { color: #58a6ff; }
  .stat-card.yellow .value { color: #d29922; }
  .stat-card.purple .value { color: #bc8cff; }

  .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .chart-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; }
  .chart-card h3 { font-size: 14px; color: #e6edf3; margin-bottom: 16px; }
  .chart-card canvas { max-height: 250px; }

  .table-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin-bottom: 24px; overflow-x: auto; }
  .table-card h3 { font-size: 14px; color: #e6edf3; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: #8b949e; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; padding: 8px 12px; border-bottom: 1px solid #30363d; }
  td { padding: 8px 12px; border-bottom: 1px solid #21262d; color: #c9d1d9; }
  tr:hover td { background: #1c2128; }
  .text-right { text-align: right; }
  .text-muted { color: #8b949e; }

  @media (max-width: 768px) {
    .chart-row { grid-template-columns: 1fr; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .loading { text-align: center; padding: 60px; color: #8b949e; }
  .error-box { background: #da363333; border: 1px solid #f85149; color: #f85149; padding: 16px; border-radius: 8px; margin: 24px 0; }
</style>
</head>
<body>

<div class="header">
  <h1>My Plugin</h1>
  <div class="actions">
    <select id="windowSelect" onchange="loadAll()">
      <option value="24">Last 24h</option>
      <option value="168">Last 7 days</option>
      <option value="720">Last 30 days</option>
      <option value="2160">Last 90 days</option>
      <option value="0" selected>All time</option>
    </select>
    <button class="refresh-btn" onclick="loadAll()">&#x21bb; Refresh</button>
  </div>
</div>

<div class="container" id="app">
  <div class="loading">Loading...</div>
</div>

<script>
const API = '';
let charts = {};

function $(sel) { return document.querySelector(sel); }
function nf(n) { return n == null ? '—' : Number(n).toLocaleString(); }
function fmtCost(v) { return v == null ? '$0.00' : '$' + Number(v).toFixed(4); }

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

function destroyChart(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }

async function loadAll() {
  const hours = $('#windowSelect').value;
  const app = $('#app');
  app.innerHTML = '<div class="loading">Loading...</div>';

  try {
    // ADAPT: add your endpoints here, ALL must include ?hours=${hours}
    const [summary /*, other1, other2 */] = await Promise.all([
      fetchJSON(`/api/summary?hours=${hours}`),
      // fetchJSON(`/api/other1?hours=${hours}`),
      // fetchJSON(`/api/other2?hours=${hours}`),
    ]);

    const r = summary.runs || {};

    let html = '<div class="stat-grid">';
    html += renderStatCard('sessions', nf(r.total_runs), 'Sessions', 'blue');
    html += renderStatCard('ok', nf(r.ok_runs), 'OK', 'green');
    // html += renderStatCard('other', nf(r.other), 'Other', 'purple');
    html += '</div>';

    // ADAPT: add your charts, tables
    html += renderCharts();
    html += renderTables();

    app.innerHTML = html;
    drawCharts(summary /*, other1, other2 */);

  } catch (err) {
    app.innerHTML = `<div class="error-box">Error: ${err.message}</div>`;
  }
}

function renderStatCard(id, value, label, cls) {
  return `<div class="stat-card ${cls}"><div class="value">${value}</div><div class="label">${label}</div></div>`;
}

function renderCharts() {
  return `
    <div class="chart-row">
      <div class="chart-card"><h3>My Chart</h3><canvas id="chart-my"></canvas></div>
      <div class="chart-card"><h3>Another Chart</h3><canvas id="chart-another"></canvas></div>
    </div>
  `;
}

function renderTables() {
  return `
    <div class="table-card"><h3>My Data</h3>
      <table><thead><tr><th>Col1</th><th class="text-right">Col2</th></tr></thead>
        <tbody id="my-table-body"></tbody>
      </table>
    </div>
  `;
}

function drawCharts(summary /*, other1, other2 */) {
  // ADAPT: draw your Chart.js charts here
  // Example:
  // const ctx = document.getElementById('chart-my').getContext('2d');
  // charts['chart-my'] = new Chart(ctx, { type: 'line', data: {...}, options: {...} });
}

function drawBarChart(canvasId, labels, data, color, yLabel) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId).getContext('2d');
  charts[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ data, backgroundColor: color, borderRadius: 4 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#8b949e', font: { size: 11 } }, grid: { display: false } },
        y: { ticks: { color: '#8b949e', font: { size: 11 } }, grid: { color: '#21262d' }, title: { display: !!yLabel, text: yLabel, color: '#8b949e' } },
      },
    },
  });
}

loadAll();
setInterval(loadAll, 30000);
</script>
</body>
</html>
