# <APP_NAME> configuration
# Lines starting with # are comments.
# Format: key: value (one per line, dot-notation for nesting)

# === Polling ===
poll_interval_sec: 30
retention_days: 7
rollup_after_hours: 24
rollup_retention_days: 90

# === Thresholds ===
# CPU
cpu_load_1m: 4.0
cpu_temp_c: 80.0
# Memory
mem_free_mb: 500
swap_used_mb: 4096
# Disk
disk_used_pct: 90

# === Sustained samples (how many consecutive samples before alerting) ===
# At default poll_interval_sec=30: 4 = 2 min, 8 = 4 min
sustained_samples_cpu: 4
sustained_samples_temp: 4
sustained_samples_mem: 4
sustained_samples_swap: 4
sustained_samples_disk: 1   # disk fills slowly, no need to debounce

# === Cooldown ===
# Minimum seconds between repeated alerts for the same metric
cooldown_sec: 600

# === Notifications ===
telegram:
  enabled: false
  bot_token: ""             # or set SYSTOR_TELEGRAM_BOT_TOKEN env var
  chat_id: ""               # or set SYSTOR_TELEGRAM_CHAT_ID env var

discord:
  enabled: false
  webhook_url: ""            # or set SYSTOR_DISCORD_WEBHOOK env var

# === Web dashboard ===
web:
  host: 127.0.0.1
  port: 6677

# === Logging ===
logging:
  level: INFO
  file: /var/log/<APP_NAME>/<APP_NAME>.log
