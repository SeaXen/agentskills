[Unit]
Description=<APP_DESCRIPTION>
After=network-online.target
Wants=network-online.target

[Service]
Type=simple
ExecStart=/usr/bin/python3 -m <APP_NAME> serve <COMPONENT>
WorkingDirectory=/opt/<APP_NAME>
Restart=always
RestartSec=10
StartLimitBurst=5
StartLimitIntervalSec=120
StandardOutput=append:/var/log/<APP_NAME>/<COMPONENT>.log
StandardError=append:/var/log/<APP_NAME>/<COMPONENT>.log

# Load all APP_* env vars; "-" means file is optional
EnvironmentFile=-/etc/<APP_NAME>/<APP_NAME>.env

[Install]
WantedBy=default.target
